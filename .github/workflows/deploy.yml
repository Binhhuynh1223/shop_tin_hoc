name: Deploy

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer validate --no-check-publish
            composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader
            chmod -R 775 public/images/avatars
            chmod -R 775 public/images/products
            chmod -R 775 public/images/reviews
            echo "Deployment completed successfully!"
